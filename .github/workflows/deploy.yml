name: Build and Deploy to Local VM

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image_name
        shell: bash
        run: |
          IMAGE_REPOSITORY="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set image tags
        id: image
        run: |
          echo "image=${REGISTRY}/${{ steps.image_name.outputs.image_repository }}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${REGISTRY}/${{ steps.image_name.outputs.image_repository }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}

  deploy:
    runs-on: self-hosted
    needs: build
    permissions:
      contents: read
      packages: read
    env:
      VM_HOST: ${{ secrets.VM_HOST || '192.168.56.10' }}
      VM_PORT: ${{ secrets.VM_PORT || '22' }}
      VM_USER: ${{ secrets.VM_USER || 'vagrant' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'postgres' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'appdb' }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deployment settings
        shell: bash
        run: |
          repo_owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo_name="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          registry_namespace="ghcr.io/${repo_owner}"
          app_image="ghcr.io/${repo_owner}/${repo_name}:latest"
          echo "REPO_OWNER=${repo_owner}" >> "$GITHUB_ENV"
          echo "REPO_NAME=${repo_name}" >> "$GITHUB_ENV"
          echo "REGISTRY_NAMESPACE=${registry_namespace}" >> "$GITHUB_ENV"
          echo "APP_IMAGE=${app_image}" >> "$GITHUB_ENV"

      - name: Resolve SSH key
        shell: bash
        run: |
          secret_key="${{ secrets.VM_SSH_PRIVATE_KEY }}"
          if [ -n "$secret_key" ]; then
            key_path="$RUNNER_TEMP/vagrant_vm_key"
            printf '%s\n' "$secret_key" | tr -d '\r' > "$key_path"
            chmod 600 "$key_path"
            echo "SSH_KEY_PATH=$key_path" >> "$GITHUB_ENV"
            echo "Using SSH private key from GitHub Secrets."
            exit 0
          fi

          candidate_paths=(
            "$GITHUB_WORKSPACE/.vagrant/machines/default/virtualbox/private_key"
            "$RUNNER_WORKSPACE/${{ github.event.repository.name }}/${{ github.event.repository.name }}/.vagrant/machines/default/virtualbox/private_key"
            "$HOME/.vagrant.d/insecure_private_key"
          )

          for path in "${candidate_paths[@]}"; do
            if [ -f "$path" ]; then
              chmod 600 "$path" || true
              echo "SSH_KEY_PATH=$path" >> "$GITHUB_ENV"
              echo "Using local SSH private key: $path"
              exit 0
            fi
          done

          echo "No SSH private key found. Set VM_SSH_PRIVATE_KEY secret or ensure the local Vagrant key exists on the self-hosted runner." >&2
          exit 1

      - name: Debug resolved variables
        shell: bash
        run: |
          echo "Working directory: $GITHUB_WORKSPACE"
          echo "SSH target: $VM_USER@$VM_HOST:$VM_PORT"
          echo "POSTGRES_USER=$POSTGRES_USER"
          echo "POSTGRES_DB=$POSTGRES_DB"
          echo "REGISTRY_NAMESPACE=$REGISTRY_NAMESPACE"
          echo "REPO_NAME=$REPO_NAME"
          echo "APP_IMAGE=$APP_IMAGE"
          echo "SSH_KEY_PATH=$SSH_KEY_PATH"

      - name: Create deployment env file
        shell: bash
        run: |
          env_path="$RUNNER_TEMP/deploy.env"
          cat > "$env_path" <<EOF
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          REGISTRY=$REGISTRY_NAMESPACE
          IMAGE_NAME=$REPO_NAME
          IMAGE_TAG=latest
          APP_IMAGE=$APP_IMAGE
          APP_PORT=80
          EOF
          echo "DEPLOY_ENV_PATH=$env_path" >> "$GITHUB_ENV"
          echo "Generated deployment env file at $env_path"

      - name: Copy deployment files to VM
        shell: bash
        run: |
          target="$VM_USER@$VM_HOST"
          echo "Copying deployment files to $target"
          ssh -i "$SSH_KEY_PATH" -p "$VM_PORT" -o StrictHostKeyChecking=no "$target" "mkdir -p ~/app"
          scp -i "$SSH_KEY_PATH" -P "$VM_PORT" -o StrictHostKeyChecking=no docker-compose.yml "$target:~/app/docker-compose.yml"
          scp -i "$SSH_KEY_PATH" -P "$VM_PORT" -o StrictHostKeyChecking=no "$DEPLOY_ENV_PATH" "$target:~/app/.env"
          scp -i "$SSH_KEY_PATH" -P "$VM_PORT" -o StrictHostKeyChecking=no -r prometheus "$target:~/app/"
          scp -i "$SSH_KEY_PATH" -P "$VM_PORT" -o StrictHostKeyChecking=no -r grafana "$target:~/app/"
          scp -i "$SSH_KEY_PATH" -P "$VM_PORT" -o StrictHostKeyChecking=no -r scripts "$target:~/app/"

      - name: Deploy on VM
        shell: bash
        run: |
          target="$VM_USER@$VM_HOST"
          echo "Deploying on $target"
          ssh -i "$SSH_KEY_PATH" -p "$VM_PORT" -o StrictHostKeyChecking=no "$target" "
            export GHCR_USERNAME='${{ github.repository_owner }}'
            export GHCR_TOKEN='$GHCR_TOKEN'
            cd ~/app
            sed -i 's/\r$//' scripts/deploy.sh
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
          "
