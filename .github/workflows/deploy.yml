name: Build and Deploy to Azure VM

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../..

      - name: Initialize Terraform without backend
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate

  build:
    runs-on: ubuntu-latest
    needs: terraform
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      latest: ${{ steps.image.outputs.latest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image_name
        shell: bash
        run: |
          IMAGE_REPOSITORY="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set image tags
        id: image
        run: |
          echo "image=${REGISTRY}/${{ steps.image_name.outputs.image_repository }}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${REGISTRY}/${{ steps.image_name.outputs.image_repository }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: /opt/queue-app
      APP_IMAGE: ${{ needs.build.outputs.image }}
      APP_PORT: "80"
      VM_HOST: ${{ secrets.AZURE_VM_HOST }}
      VM_USER: ${{ secrets.AZURE_VM_USER }}
      VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        shell: bash
        run: |
          test -n "$VM_HOST" || { echo "Missing AZURE_VM_HOST secret"; exit 1; }
          test -n "$VM_USER" || { echo "Missing AZURE_VM_USER secret"; exit 1; }
          test -n "$VM_SSH_KEY" || { echo "Missing AZURE_VM_SSH_KEY secret"; exit 1; }

      - name: Prepare SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/azure_vm
          chmod 600 ~/.ssh/azure_vm
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Package runtime files
        shell: bash
        run: |
          tar -czf queue-app-runtime.tgz \
            docker-compose.yml \
            prometheus \
            grafana \
            scripts

      - name: Upload runtime files to VM
        shell: bash
        run: |
          scp -i ~/.ssh/azure_vm queue-app-runtime.tgz "$VM_USER@$VM_HOST:/tmp/queue-app-runtime.tgz"
          ssh -i ~/.ssh/azure_vm "$VM_USER@$VM_HOST" "mkdir -p '$APP_DIR' && tar -xzf /tmp/queue-app-runtime.tgz -C '$APP_DIR'"

      - name: Deploy on VM
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          cat > .env.deploy <<EOF
          APP_IMAGE=$APP_IMAGE
          APP_PORT=$APP_PORT
          POSTGRES_USER=queue_user
          POSTGRES_PASSWORD=queue_password
          POSTGRES_DB=queue_db
          EOF

          scp -i ~/.ssh/azure_vm .env.deploy "$VM_USER@$VM_HOST:/tmp/queue-app.env"
          ssh -i ~/.ssh/azure_vm "$VM_USER@$VM_HOST" "mv /tmp/queue-app.env '$APP_DIR/.env'"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/azure_vm "$VM_USER@$VM_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          ssh -i ~/.ssh/azure_vm "$VM_USER@$VM_HOST" "cd '$APP_DIR' && chmod +x scripts/deploy.sh && ./scripts/deploy.sh"
